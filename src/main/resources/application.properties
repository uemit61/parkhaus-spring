spring.application.name=parkhaus-spring

# Tomcat-Port. Die Voreinstellung 8080 ist auf diesem Rechner durch XAMPP
# belegt; ein besetzter Port laesst die Anwendung beim Start abbrechen.
server.port=8081


# ---------------------------------------------------------------------------
# Datenbank
# ---------------------------------------------------------------------------
# Benutzer und Passwort stehen NICHT hier, sondern kommen als Umgebungs-
# variablen herein. ${DB_USER} ist ein Platzhalter, den Spring beim Start
# aufloest - fehlt die Variable, bricht die Anwendung mit einer klaren Meldung
# ab, statt sich mit falschen Daten zu verbinden.
# In IntelliJ: Run > Edit Configurations > Environment variables.
spring.datasource.url=jdbc:mysql://localhost:3307/parkhaus
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# Das Schema existiert bereits (db_parkhaus.sql aus dem Swing-Projekt).
# "validate" heisst: beim Start pruefen, ob die Entity-Klassen zu den echten
# Tabellen passen - und bei Abweichung mit einer genauen Meldung abbrechen.
# An der Datenbank wird dabei nichts geaendert.
spring.jpa.hibernate.ddl-auto=validate

# Zeigt jedes SQL, das Hibernate erzeugt, auf der Konsole. Beim Lernen der
# wichtigste Schalter ueberhaupt: man sieht, was eine abgeleitete
# Repository-Methode tatsaechlich absetzt.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Haelt die Hibernate-Session nicht bis zum Rendern der Antwort offen.
# Ist die Voreinstellung "true" aktiv, warnt Spring beim Start davor, weil
# dann noch waehrend der Ausgabe Datenbankabfragen laufen koennen.
spring.jpa.open-in-view=false
