spring.application.name=parkhaus-spring

# Tomcat-Port. Die Voreinstellung 8080 ist auf diesem Rechner durch XAMPP
# belegt; ein besetzter Port lässt die Anwendung beim Start abbrechen.
server.port=8081


# ---------------------------------------------------------------------------
# Datenbank
# ---------------------------------------------------------------------------
# Benutzer und Passwort stehen NICHT hier, sondern kommen als Umgebungs-
# variablen herein. ${DB_USER} ist ein Platzhalter, den Spring beim Start
# auflöst.
#
# ACHTUNG: Ist die Variable nicht gesetzt, meldet Spring das NICHT. Der Text
# "${DB_USER}" wird wörtlich durchgereicht und landet als Benutzername bei
# MySQL. Die Meldung lautet dann:
#     Access denied for user '${DB_USER}'@'localhost' (using password: YES).
# Das sieht nach einem falschen Passwort aus, ist aber eine fehlende Variable.
#
# Einmalig für den Benutzer setzen - danach sehen es IntelliJ UND PowerShell
# (Neustart beider nötig):
#     [Environment]::SetEnvironmentVariable("DB_USER", "...", "User")
#     [Environment]::SetEnvironmentVariable("DB_PASSWORD", "...", "User")
spring.datasource.url=jdbc:mysql://localhost:3307/parkhaus_spring
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
# Das Schema baut Flyway (siehe db/migration), nicht Hibernate.
# "validate" heißt: beim Start prüfen, ob die Entity-Klassen zu den Tabellen
# passen, die die Migrationen angelegt haben - und bei Abweichung mit einer
# genauen Meldung abbrechen. An der Datenbank wird dabei nichts geändert.
# Arbeitsteilung: Flyway baut das Schema, Hibernate prüft es nur.
spring.jpa.hibernate.ddl-auto=validate

# Zeigt jedes SQL, das Hibernate erzeugt, auf der Konsole. Beim Lernen der
# wichtigste Schalter überhaupt: man sieht, was eine abgeleitete
# Repository-Methode tatsächlich absetzt.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hält die Hibernate-Session nicht bis zum Rendern der Antwort offen.
# Ist die Voreinstellung "true" aktiv, warnt Spring beim Start davor, weil
# dann noch während der Ausgabe Datenbankabfragen laufen können.
spring.jpa.open-in-view=false
